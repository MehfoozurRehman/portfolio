<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none" role="img" aria-label="Karobari: a WhatsApp voice note becomes a live storefront">
  <defs>
    <linearGradient id="kb-bg" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#11141a"/>
      <stop offset="1" stop-color="#1b1210"/>
    </linearGradient>
    <radialGradient id="kb-glow" cx="0" cy="0" r="1" gradientTransform="translate(620 250) rotate(90) scale(300)">
      <stop stop-color="#ff6a2c" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ff6a2c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="kb-glow2" cx="0" cy="0" r="1" gradientTransform="translate(150 380) rotate(90) scale(240)">
      <stop stop-color="#4dd4a7" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#4dd4a7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="kb-teal" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#4dd4a7"/>
      <stop offset="1" stop-color="#1c6b56"/>
    </linearGradient>
    <linearGradient id="kb-orange" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ff6a2c"/>
      <stop offset="1" stop-color="#d9531e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#kb-bg)"/>
  <rect width="800" height="500" fill="url(#kb-glow)"/>
  <rect width="800" height="500" fill="url(#kb-glow2)"/>
  <g opacity="0.5" stroke="#ffffff" stroke-opacity="0.05">
    <path d="M0 125h800M0 375h800M200 0v500M600 0v500"/>
  </g>

  <!-- voice note (left) -->
  <g>
    <rect x="70" y="200" width="250" height="84" rx="42" fill="url(#kb-teal)"/>
    <circle cx="112" cy="242" r="22" fill="#06251d" fill-opacity="0.35"/>
    <path d="M105 231 L124 242 L105 253 Z" fill="#ffffff" fill-opacity="0.9"/>
    <g fill="#06251d" fill-opacity="0.6">
      <rect x="150" y="236" width="5" height="12" rx="2.5"/>
      <rect x="162" y="228" width="5" height="28" rx="2.5"/>
      <rect x="174" y="222" width="5" height="40" rx="2.5"/>
      <rect x="186" y="231" width="5" height="22" rx="2.5"/>
      <rect x="198" y="226" width="5" height="32" rx="2.5"/>
      <rect x="210" y="234" width="5" height="16" rx="2.5"/>
      <rect x="222" y="224" width="5" height="36" rx="2.5"/>
      <rect x="234" y="230" width="5" height="24" rx="2.5"/>
      <rect x="246" y="236" width="5" height="12" rx="2.5"/>
      <rect x="258" y="232" width="5" height="20" rx="2.5"/>
      <rect x="270" y="238" width="5" height="8" rx="2.5"/>
    </g>
    <text x="70" y="316" font-family="monospace" font-size="13" letter-spacing="2.5" fill="#ffffff" fill-opacity="0.38">VOICE NOTE · URDU / EN</text>
  </g>

  <!-- conversion path -->
  <path d="M330 242 C 380 242, 390 242, 430 242" stroke="#ff6a2c" stroke-opacity="0.7" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 11"/>
  <g transform="translate(380 242)">
    <circle r="28" fill="#ff6a2c" fill-opacity="0.16"/>
    <path d="M0 -14 L3.5 -3.5 L14 0 L3.5 3.5 L0 14 L-3.5 3.5 L-14 0 L-3.5 -3.5 Z" fill="#ff6a2c"/>
  </g>

  <!-- storefront (right) -->
  <g>
    <rect x="440" y="110" width="290" height="280" rx="22" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
    <rect x="440" y="110" width="290" height="44" rx="22" fill="#ffffff" fill-opacity="0.05"/>
    <circle cx="464" cy="132" r="5" fill="#ffffff" fill-opacity="0.25"/>
    <circle cx="482" cy="132" r="5" fill="#ffffff" fill-opacity="0.25"/>
    <circle cx="500" cy="132" r="5" fill="#ffffff" fill-opacity="0.25"/>
    <rect x="530" y="123" width="150" height="18" rx="9" fill="#ffffff" fill-opacity="0.08"/>

    <!-- shop title -->
    <rect x="464" y="172" width="110" height="12" rx="6" fill="#ffffff" fill-opacity="0.55"/>
    <rect x="464" y="194" width="70" height="8" rx="4" fill="#ffffff" fill-opacity="0.22"/>

    <!-- product tiles -->
    <g>
      <rect x="464" y="222" width="76" height="86" rx="12" fill="#4dd4a7" fill-opacity="0.2"/>
      <rect x="474" y="286" width="40" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.45"/>
      <rect x="552" y="222" width="76" height="86" rx="12" fill="#ff6a2c" fill-opacity="0.22"/>
      <rect x="562" y="286" width="46" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.45"/>
      <rect x="640" y="222" width="66" height="86" rx="12" fill="#ffffff" fill-opacity="0.08"/>
      <rect x="650" y="286" width="32" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.35"/>
    </g>

    <!-- order bar -->
    <rect x="464" y="328" width="242" height="42" rx="21" fill="url(#kb-orange)"/>
    <rect x="488" y="345" width="78" height="9" rx="4.5" fill="#140a04" fill-opacity="0.55"/>
    <circle cx="684" cy="349" r="10" fill="#140a04" fill-opacity="0.3"/>
    <path d="M679 349h10M685 344l5 5-5 5" stroke="#fdf6ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- live badge -->
  <g transform="translate(706 96)">
    <rect x="-44" y="-15" width="88" height="30" rx="15" fill="#0d0f13" stroke="#4dd4a7" stroke-opacity="0.5"/>
    <circle cx="-24" cy="0" r="4.5" fill="#4dd4a7"/>
    <text x="-12" y="4.5" font-family="monospace" font-size="12" font-weight="700" letter-spacing="1.5" fill="#4dd4a7">LIVE</text>
  </g>

  <text x="70" y="440" font-family="monospace" font-size="15" letter-spacing="3" fill="#ffffff" fill-opacity="0.32">VOICE → STOREFRONT · KAROBARI</text>
</svg>
